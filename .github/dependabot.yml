version: 2

updates:
  # Update npm packages
  - package-ecosystem: npm
    directory: /
    open-pull-requests-limit: 10

    # Group packages into shared PR
    groups:
      # Babel packages are versioned in lockstep — group them (incl. majors)
      # so a 7->8 style bump lands as one PR, not separate conflicting ones
      babel:
        applies-to: 'version-updates'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
        patterns:
          - '@babel/*'
          - 'babel-loader'

      # vitest and @vitest/coverage-v8 require matching versions (strict peer
      # dependency) — group them (incl. majors) so a bump to one always lands
      # with the other, instead of two PRs that each break npm ci alone
      vitest:
        applies-to: 'version-updates'
        update-types:
          - 'major'
          - 'minor'
          - 'patch'
        patterns:
          - 'vitest'
          - '@vitest/*'
          - 'vitest-fetch-mock'

      dev:
        applies-to: 'version-updates'
        dependency-type: 'development'
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

      prod:
        applies-to: 'version-updates'
        dependency-type: 'production'
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

      security:
        applies-to: 'security-updates'
        patterns:
          - '*'

      other:
        update-types:
          - 'minor'
          - 'patch'
        patterns:
          - '*'

    # Schedule run nightly
    schedule:
      interval: 'cron'
      cronjob: '0 0 * * *'

    cooldown:
      default-days: 3

    versioning-strategy: increase

    allow:
      # Include direct package.json updates
      - dependency-type: direct

  # Update GitHub Actions
  - package-ecosystem: github-actions
    directory: /

    # Schedule run nightly
    schedule:
      interval: 'cron'
      cronjob: '0 0 * * *'
