services:
  epr-register-enrol-entra-stub:
    build: ./
    ports:
      - '3010:3010'
    environment:
      NODE_ENV: development
      STUB_EXTERNAL_URL: http://localhost:3010
      STUB_INTERNAL_URL: http://epr-register-enrol-entra-stub:3010
      CALLBACK_CM_URL: http://localhost:3000
    networks:
      - cdp-tenant

networks:
  cdp-tenant:
    driver: bridge
    name: cdp-tenant
